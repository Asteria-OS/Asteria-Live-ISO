name: Build Asteria ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asteria-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: archlinux:base-devel
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Asteria source
        uses: actions/checkout@v4

      - name: Install Arch build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --needed --noconfirm archiso mkinitcpio-archiso squashfs-tools grub syslinux mtools gptfdisk git

      - name: Configure CachyOS package signing key
        run: |
          set -euo pipefail
          fingerprint=882DCFE48E2051D48E2562ABF3B607488DB35A47
          pacman-key --recv-keys "$fingerprint" --keyserver keyserver.ubuntu.com
          actual=$(pacman-key --finger "$fingerprint" | tr -d ' ' | grep -F "$fingerprint")
          test -n "$actual"
          pacman-key --lsign-key "$fingerprint"
          printf '\n[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' >> /etc/pacman.conf
          pacman -Syu --needed --noconfirm cachyos-keyring

      - name: Build Asteria ISO
        run: bash ./build-asteria.sh

      - name: Generate SHA-256 checksum
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/asteria.*/*.iso)
          if (( ${#files[@]} != 1 )); then
            printf 'Expected one ISO, found %s\n' "${#files[@]}" >&2
            exit 1
          fi
          (cd "$(dirname "${files[0]}")" && sha256sum "$(basename "${files[0]}")" > SHA256SUMS)

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: asteria-os-iso-${{ github.run_id }}
          path: |
            out/asteria.*/*.iso
            out/asteria.*/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
